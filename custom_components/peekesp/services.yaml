generate_pairing_code: {}

get_pairing_code:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: peekesp

rotate_pairing_code:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: peekesp

get_links:
  fields:
    notify:
      required: false
      default: false
      selector:
        boolean:

refresh:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: peekesp

set_options:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: peekesp
    scan_interval:
      required: false
      selector:
        number:
          min: 5
          max: 600
          unit_of_measurement: s
          mode: box
    offline_after:
      required: false
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: s
          mode: box

pair:
  fields:
    code:
      required: true
      example: "K7M2-P4QX-9R"
      selector:
        text:
    relay_base:
      required: false
      default: "https://peek-relay-b9a8.onrender.com"
      selector:
        text:
    store_code:
      required: false
      default: false
      selector:
        boolean:

add_custom_relay:
  fields:
    url:
      required: true
      example: "https://relay.example.com/telemetry/my-stream"
      selector:
        text:
    token:
      required: true
      selector:
        text:
          type: password
