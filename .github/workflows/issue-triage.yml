name: Issue triage

# New and edited issues: scrub pasted secrets, label by area, ask for logs on
# bug reports that have none, assign the maintainers.
# Logic lives in .github/scripts/triage.js (unit tested in lint.yml).

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./.github/scripts/triage.js')({ github, context, core });
