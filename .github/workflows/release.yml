name: Release

# Tags and publishes a GitHub release whenever manifest.json carries a version
# that has no release yet. HACS lists releases, so this is what makes a new
# version show up as an update.
#
#   1. bump "version" in custom_components/peekesp/manifest.json AND the
#      `const VERSION` in frontend/peekesp-card.js (tests/test_core.py checks
#      they agree)
#   2. merge to the default branch
#
# Re-running is safe: an existing release is left alone. A version with a
# hyphen (0.2.0-beta.1) is published as a pre-release. Notes are generated by
# GitHub from merged PRs, grouped by .github/release.yml.

on:
  push:
    branches: [main, master]
    paths:
      - custom_components/peekesp/manifest.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only ever release from the default branch, manual runs included.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Tests must pass before anything is published
        run: |
          pip install aiohttp
          python tests/test_core.py
          npm install --no-save jsdom
          node tests/test_card.js

      - name: Read version from manifest.json
        id: manifest
        run: |
          version="$(python3 -c "import json; print(json.load(open('custom_components/peekesp/manifest.json'))['version'])")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::manifest.json version '$version' is not a version number"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Is it already released?
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is already released, nothing to do."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package the integration
        if: steps.existing.outputs.released == 'false'
        run: |
          cd custom_components/peekesp
          zip -r -q ../../peekesp.zip . -x '*__pycache__*' '*.pyc'

      - name: Publish release
        if: steps.existing.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          flags=(--target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes)
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "v${VERSION}" peekesp.zip "${flags[@]}"
